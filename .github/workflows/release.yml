# Release pipeline: tag vX.Y.Z (matching noswooshVersion in noswoosh.swift) and push.
# Builds the binary, assembles noswoosh.app, signs + notarizes + staples both, attaches
# them to the GitHub Release, and bumps the cask in mmathys/homebrew-tap.
#
# Secrets: DEVELOPER_ID_CERT_P12_BASE64, DEVELOPER_ID_CERT_PASSWORD, CI_KEYCHAIN_PASSWORD,
# DEVELOPER_ID_SIGN_IDENTITY, ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_P8_BASE64,
# and HOMEBREW_TAP_TOKEN (fine-grained PAT, Contents:write on mmathys/homebrew-tap).
# Each group is optional: missing signing secrets skip signing, missing ASC secrets skip
# notarization, a missing tap token skips the cask bump. The build always runs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src=$(sed -n 's/^let noswooshVersion = "\(.*\)"$/\1/p' noswoosh.swift)
          if [ "$tag" != "$src" ]; then
            echo "tag $GITHUB_REF_NAME does not match noswooshVersion ($src)" >&2
            exit 1
          fi
          echo "version=$src" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        id: signing
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          if [ -n "$CERT" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$CERT" ] && [ -n "$ASC_KEY" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER" ]; then
            echo "can_notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build binary
        run: |
          swiftc noswoosh.swift -O -o noswoosh \
            -F /System/Library/PrivateFrameworks -framework SkyLight

      - name: Sign binary
        if: steps.signing.outputs.enabled == 'true'
        env:
          IDENTITY: ${{ secrets.DEVELOPER_ID_SIGN_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp --sign "$IDENTITY" noswoosh
          codesign --verify --strict --verbose=2 noswoosh

      - name: Assemble app bundle
        env:
          NOSWOOSH_SIGN_IDENTITY: ${{ steps.signing.outputs.enabled == 'true' && secrets.DEVELOPER_ID_SIGN_IDENTITY || '' }}
        run: ./scripts/make-app-bundle.sh --binary ./noswoosh --out build

      - name: Notarize app bundle
        if: steps.signing.outputs.can_notarize == 'true'
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          echo "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          ditto -c -k --keepParent build/noswoosh.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER" --wait
          xcrun stapler staple build/noswoosh.app
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/notarize.zip"

      - name: Package artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip -j "noswoosh-$VERSION-macos.zip" noswoosh
          ditto -c -k --keepParent build/noswoosh.app "noswoosh-$VERSION.app.zip"
          shasum -a 256 "noswoosh-$VERSION-macos.zip" "noswoosh-$VERSION.app.zip"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || echo "release already exists, uploading assets"
          gh release upload "$GITHUB_REF_NAME" \
            "noswoosh-$VERSION-macos.zip" "noswoosh-$VERSION.app.zip" --clobber

      - name: Bump cask in homebrew-tap
        if: steps.signing.outputs.can_notarize == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping cask bump."
            echo "Update Casks/noswoosh.rb in mmathys/homebrew-tap by hand."
            exit 0
          fi
          sha=$(shasum -a 256 "noswoosh-$VERSION.app.zip" | cut -d' ' -f1)
          git clone --depth=1 \
            "https://x-access-token:$TAP_TOKEN@github.com/mmathys/homebrew-tap.git" tap
          cd tap
          sed -i '' \
            -e "s|^  version \".*\"$|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$sha\"|" \
            Casks/noswoosh.rb
          if git diff --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "noswoosh $VERSION"
          # The release is already published by now, so a tap push failure (bad or
          # expired token) must not mark the release itself as failed — warn instead.
          if git push; then
            echo "Cask bumped to $VERSION ($sha)."
          else
            echo "::warning::Could not push the cask bump — check HOMEBREW_TAP_TOKEN. Set version=$VERSION sha256=$sha in mmathys/homebrew-tap by hand."
          fi
